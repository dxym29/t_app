name: One-time glossary and Name Lock update
on:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch translation consistency
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('server.mjs')
          text=p.read_text(encoding='utf-8')

          pattern=r"function buildNameLocks\(g\)\{.*?function masterPrompt"
          replacement=r'''function normalizeLockTerm(value){return String(value??'').replace(/\s+/g,' ').trim()}
          function escapeRegex(value){return String(value).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
          function lockRegex(term){const clean=normalizeLockTerm(term);if(!clean)return null;return new RegExp(clean.split(/\s+/).map(escapeRegex).join('\\s+'),'g')}
          function buildNameLocks(g){const locks=[];const seen=new Set();let n=1;for(const [type,arr] of Object.entries(g||{}))for(const x of arr||[]){const original=normalizeLockTerm(x.original),translation=normalizeLockTerm(x.translation);if(!original||!translation||seen.has(original))continue;seen.add(original);locks.push({type,original,translation,token:`[[NAMELOCK_${String(n++).padStart(3,'0')}]]`})}locks.sort((a,b)=>b.original.length-a.original.length);return locks}
          function filterGlossaryToSource(g,source){const text=String(source||'');const out={};for(const [type,arr] of Object.entries(g||{}))out[type]=(arr||[]).filter(x=>{const original=normalizeLockTerm(x.original),re=lockRegex(original);return !!(original&&re&&re.test(text))});return out}
          function lockText(text,locks){let out=String(text||'');for(const x of locks){const re=lockRegex(x.original);if(re)out=out.replace(re,x.token)}return out}
          function lockTranslationText(text,locks){let out=String(text||'');for(const x of [...locks].sort((a,b)=>b.translation.length-a.translation.length)){const re=lockRegex(x.translation);if(re)out=out.replace(re,x.token)}return out}
          function restoreNameLocks(text,locks){let out=String(text||'');for(const x of [...locks].sort((a,b)=>b.original.length-a.original.length)){const re=lockRegex(x.original);if(re)out=out.replace(re,x.token)}for(const x of locks)out=out.split(x.token).join(x.translation);return out}
          function lockedGlossaryText(g,locks){const map=new Map(locks.map(x=>[x.original,x]));const lines=[];for(const [type,arr] of Object.entries(g||{}))for(const x of arr||[]){const original=normalizeLockTerm(x.original),translation=normalizeLockTerm(x.translation),l=map.get(original);lines.push(`${type}: ${l?.token||original} => ${translation}${x.voice?` | voice: ${x.voice}`:''}${x.note?` | note: ${x.note}`:''}`)}return lines.join('\n')||'(none)'}
          function countChars(text){return Array.from(String(text||'')).length}
          function tokenRegex(token){return new RegExp(token.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g')}
          function countToken(text,token){return (String(text||'').match(tokenRegex(token))||[]).length}
          function normalizeForCompare(text){return String(text||'').replace(/\r/g,'').replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim()}
          function masterPrompt'''
          text,n=re.subn(pattern,replacement,text,count=1,flags=re.S)
          if n!=1: raise SystemExit('Name Lock block not found')
          p.write_text(text,encoding='utf-8')

          # Keep the improved AI #2 prompt already intended for the glossary extractor.
          prompt='''function glossaryPrompt(source){return `You are an IMPORTANT STORY ENTITY DETECTOR for a web-novel translation system. Do NOT list everything in the chapter. Extract only named entities and story terms important enough to remember for consistent translation across later episodes.

PRIMARY GOAL:
Extract a small, high-value glossary set: major characters, recurring or potentially recurring supporting characters, important items, recurring or story-important locations, and important organizations. Prefer quality over quantity. When uncertain, OMIT the term.

CATEGORIES:
1. Character
2. Item
3. Organization
4. Location

SELECTION RULES:
- Extract only terms actually present in SOURCE.
- Prioritize main characters and story-relevant named supporting characters who may return later.
- Do NOT extract every passerby, unnamed person, or one-scene minor character.
- Extract important named items, weapons, artifacts, books, medicines, treasures, tools, or objects with a story role, special identity, power, ownership, or likely future reference.
- Extract named, plot-relevant, distinctive, or likely recurring locations. Do NOT extract ordinary rooms, roads, houses, shops, streets, tables, etc. unless the place itself is important or named.
- Extract important named organizations, clans, sects, groups, companies, kingdoms, schools, factions, etc.
- If a term is only a passing detail with little reason to be remembered later, leave it out.
- If unsure whether it is important or likely to recur, leave it out.
- Never invent future recurrence; judge only from the current SOURCE.
- Output each entity once.
- Clean accidental leading/trailing whitespace and collapse repeated spaces or line breaks inside original/suggested values.
- Do not translate the story or summarize it.
- Suggested Myanmar names must be concise and natural. They are suggestions only.
- Return JSON only. No markdown or explanation.

FORMAT:
{"characters":[{"original":"...","suggested":"..."}],"items":[{"original":"...","suggested":"..."}],"organizations":[{"original":"...","suggested":"..."}],"locations":[{"original":"...","suggested":"..."}]}

SOURCE:
${source}`}
'''
          text=p.read_text(encoding='utf-8')
          text,n=re.subn(r"function glossaryPrompt\(source\)\{return `.*?`\}\nfunction polishPrompt",prompt+'function polishPrompt',text,count=1,flags=re.S)
          if n!=1: raise SystemExit('glossaryPrompt not found')
          p.write_text(text,encoding='utf-8')
          PY
          node --check server.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.mjs
          git rm .github/workflows/one-time-glossary-update.yml
          git commit -m "Harden Name Lock matching and restoration"
          git push
