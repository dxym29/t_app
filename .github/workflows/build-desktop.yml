name: Build Windows Desktop App

on:
  push:
    branches:
      - desktop-exe-migration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer
        run: npm run desktop:dist
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: webnovel-translator-windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
